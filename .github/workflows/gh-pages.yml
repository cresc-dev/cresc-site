name: github pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the sitemap can date each page by its last commit.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build
        working-directory: site
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Assemble site root
        run: |
          mv site/out ./out
          cp CNAME out/
          mv policy out/policy
          cp .nojekyll out/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          # Without this the artifact drops dot-directories, so nothing under
          # /.well-known/ (agent skills, API catalog, MCP server card) is served.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    # Tell Bing, Yandex and other IndexNow engines the site changed, so new
    # and edited pages are recrawled without waiting. The key file is served
    # from site/pages/public/fc9547e7d1f4cde38e3185a40b292853.txt.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit sitemap URLs to IndexNow
        run: |
          urls=$(curl -fsSL "https://cresc.dev/sitemap.xml?v=$GITHUB_SHA" | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's/<\/loc>//' | jq -R . | jq -s -c .)
          jq -n --argjson urls "$urls" '{host: "cresc.dev", key: "fc9547e7d1f4cde38e3185a40b292853", keyLocation: "https://cresc.dev/fc9547e7d1f4cde38e3185a40b292853.txt", urlList: $urls}' \
            | curl -sS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' --data-binary @-
