name: Verify Cresc native API documentation
on:
  push:
    branches: [docs/native-host-api-v10.57.0]
    paths: [.github/workflows/native-host-docs-sync.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Synchronize reference, navigation and brownfield entry points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pending = []
          def prepare(name, replacements):
              path = Path(name)
              text = path.read_text()
              for old, new in replacements:
                  assert text.count(old) == 1, f'{name}: expected one match for {old[:80]!r}'
                  text = text.replace(old, new, 1)
              pending.append((path, text))
          prepare('site/rspress.config.ts', [(
              "            { text: 'API Reference', link: '/docs/api' },",
              "            { text: 'API Reference', link: '/docs/api' },\n"
              "            { text: 'Native Configuration and Updates', link: '/docs/native-api' },"
          )])
          prepare('site/pages/docs/api.mdx', [(
              '  disableNativeCheck?: boolean;\n}',
              '  disableNativeCheck?: boolean;\n\n'
              '  // Native configuration owner; default: javascript (JS synchronizes settings).\n'
              '  // native: native configure owns the settings; JS initialization/setOptions\n'
              '  // no longer overwrite them. In this mode, configure.disabled controls\n'
              '  // native checks; disableNativeCheck is not synchronized from JavaScript.\n'
              '  // Requires v10.57.0+. Native configure/checkAndUpdate require a rebuilt\n'
              '  // native application with v10.57.0 or later.\n'
              '  nativeConfigSource?: "javascript" | "native";\n}'
          ), (
              '#### Native cold-start check\n',
              '#### Native configuration and manual checks\n\n'
              'Since **v10.57.0**, Android, iOS, and HarmonyOS hosts can call native '
              '`configure` before JavaScript starts, then `checkAndUpdate` after the '
              'normal launch bundle resolution. These APIs prepare updates without '
              'displaying dialogs or immediately reloading React Native. Rebuild and '
              'distribute the native application when upgrading; a JS-only OTA update '
              'cannot add native methods.\n\n'
              'See [Native Configuration and Updates](/docs/native-api) for platform '
              'examples, result handling, and `nativeConfigSource` ownership rules. '
              '**Cresc native configurations must explicitly provide Cresc endpoints**; '
              'omitting `endpoints` selects the shared SDK\'s Pushy preset. The guide '
              'includes both Cresc service addresses and the matching discovery URL.\n\n'
              '#### Native cold-start check\n'
          ), (
              'Key behaviors:\n',
              'The behavior below assumes the default JavaScript-owned configuration '
              '(`nativeConfigSource: "javascript"`). With `nativeConfigSource: "native"`, '
              'native `configure` controls checking through `disabled` and ordinary '
              'activation through `afterDownload`; JS strategy changes do not update '
              'these native settings.\n\nKey behaviors:\n'
          ), (
              '- **Never disrupts the normal flow**: ordinarily it only downloads and caches; activation follows your configured strategy — with `checkStrategy: null` native downloads but never activates on its own; only a server-issued force-boot flag overrides the strategy',
              '- **No immediate reload**: native checking downloads and caches updates. '
              'With JavaScript-owned settings, silent strategies allow next-launch '
              'activation, while `checkStrategy: null` leaves ordinary activation to JS. '
              'Server force-boot and existing crash-rescue rules still apply'
          ), (
              'If you genuinely need to (traffic/battery budgets, consent-gated networking for compliance), disable it at init:',
              'With JavaScript-owned configuration, disable native checking at init '
              'when required by your networking or consent policy:'
          ), (
              'Note: a client with this disabled loses the force-boot rescue capability — once stuck on a broken update, reinstalling the app is the only way out.',
              'With native-owned configuration, instead pass `disabled: true` with '
              'your complete Cresc native configuration. This disables both automatic '
              'and manual native checks; it does not disable JavaScript checks. '
              'Gate the initial native configuration/startup flow as needed rather '
              'than relying only on a JS hook for consent.\n\n'
              'Disabling native checking removes this force-boot rescue route. A '
              'broken JS update may then require a native app upgrade or reinstall '
              'to recover.'
          )])
          prepare('site/pages/docs/brownfield.mdx', [(
              'Do not change the host app inheritance just to integrate Cresc. Wire Cresc where the AAR module creates `ReactHost`, `ReactNativeHost`, or `ReactInstanceManager`.\n',
              'Do not change the host app inheritance just to integrate Cresc. Wire Cresc where the AAR module creates `ReactHost`, `ReactNativeHost`, or `ReactInstanceManager`.\n\n'
              ':::info Native-host update controls (v10.57.0+)\n'
              'The host can also configure and trigger OTA updates without a JS '
              'bridge call. Follow [Native Configuration and Updates](/docs/native-api) '
              'for `PushyNativeUpdate.configure(...)`, `checkAndUpdate(...)`, explicit '
              'Cresc endpoints, and `nativeConfigSource: "native"`. Configure before '
              'normal RN startup, or check after an already-completed launch resolution; '
              'do not call `getBundleUrl` again merely to initialize checking. '
              'Rebuild both the React Native AAR and the host APK/AAB with v10.57.0 '
              'or later. The JavaScript example below retains the default JS-owned '
              'configuration; use the native guide\'s ownership option when the host '
              'should remain in control.\n:::\n'
          )])
          for path, text in pending:
              path.write_text(text)
          PY
      - name: Build the site and documentation index
        working-directory: site
        run: |
          bun install --frozen-lockfile
          bun run build
          node scripts/build-mcp-docs-index.mjs --check
      - name: Verify Cresc examples, rendered pages and MCP exports
        run: |
          python3 - <<'PY'
          import json, re
          from html.parser import HTMLParser
          from pathlib import Path
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.text = []
                  self.links = []
              def handle_data(self, data):
                  self.text.append(data)
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      self.links.append(dict(attrs).get('href', ''))
          source = Path('site/pages/docs/native-api.mdx').read_text()
          blocks = re.findall(r'```\w+\n(.*?)```', source, re.S)
          examples = [b for b in blocks if 'YOUR_' in b and 'appKey' in b]
          assert len(examples) == 6, f'Expected JSON and five platform configurations: {len(examples)}'
          for example in examples:
              for address in ('https://api.cresc.dev', 'https://api.cresc.app', 'endpoints_cresc.json'):
                  assert address in example, f'Missing Cresc setting: {address}'
          assert 'new Cresc(' in source and 'new Pushy(' not in source
          assert 'not yet published' not in source.lower()
          out = Path('site/out')
          pages = [p for p in out.rglob('*.html') if 'native-api' in p.parts or p.name == 'native-api.html']
          assert pages, 'Missing rendered native-api page'
          page = Page()
          page.feed(pages[0].read_text())
          visible = ''.join(page.text)
          for term in ('v10.57.0', 'nativeConfigSource', 'checkAndUpdate', 'https://api.cresc.dev'):
              assert term in visible, f'Missing rendered content: {term}'
          for link in ('/docs/api', '/docs/native-api', '/docs/brownfield'):
              assert link in page.links, f'Missing documentation link: {link}'
          index = json.loads((out / 'mcp-docs-index.json').read_text())
          assert index['product'] == 'Cresc'
          documents = {d['slug']: d for d in index['documents']}
          guide = documents['native-api']
          assert guide['url'] == 'https://cresc.dev/docs/native-api'
          assert guide['resourceUri'] == 'cresc-docs://docs/native-api'
          for term in ('v10.57.0', 'nativeConfigSource', 'endpoints_cresc.json', 'checkAndUpdate'):
              assert term in guide['content'], f'Missing MCP content: {term}'
          for slug in ('api', 'brownfield'):
              assert '/docs/native-api' in documents[slug]['content'], f'Missing guide entry: {slug}'
          assert 'nativeConfigSource' in documents['api']['content']
          assert (out / 'docs/native-api.md').is_file()
          print('Verified: six Cresc configurations, native guide HTML, navigation, Markdown and MCP index.')
          PY
          git diff --check
      - name: Commit only documentation and remove this one-off verifier
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/rspress.config.ts site/pages/docs/api.mdx site/pages/docs/brownfield.mdx
          git rm .github/workflows/native-host-docs-sync.yml
          git commit -m 'docs: link native host APIs and clarify Cresc configuration ownership'
          git push origin HEAD:refs/heads/docs/native-host-api-v10.57.0
